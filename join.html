<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسجيل كابتن الجراح</title><style>:root{--bg:#08111f;--card:#12233a;--line:#29435e;--text:#eef6ff;--muted:#a5b7ca;--gold:#f5c451;--bad:#ff7f92}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#1c4667,transparent 40%),#08111f;color:var(--text);font-family:Tahoma,Arial,sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(520px,100%);background:#12233ad9;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 20px 70px #0007;backdrop-filter:blur(16px)}h1{margin:8px 0 10px}.brand{color:var(--gold);font-weight:bold}p{color:var(--muted);line-height:1.8}input,select,button{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);font:inherit;margin:6px 0 12px}input,select{background:#071321;color:var(--text)}button{background:var(--gold);border:0;font-weight:bold;cursor:pointer}.msg{min-height:26px;color:var(--muted)}.error{color:var(--bad)}a{color:var(--gold)}</style></head><body><section class="card"><div class="brand">META 2026 · الجراح</div><h1>تسجيل كابتن جديد</h1><p>أدخل البيانات من رابط الدعوة الرسمي. بعد التسجيل سيصبح الحساب جاهزًا للدخول إلى بوابة التشغيل.</p><input id="name" placeholder="الاسم الكامل"><input id="phone" placeholder="0791234567" inputmode="tel"><select id="authMethod"><option value="pin">دخول برقم سري من 5 أرقام</option><option value="whatsapp">دخول برمز WhatsApp</option></select><input id="pin" placeholder="رقم سري من 5 أرقام" inputmode="numeric" maxlength="5" type="password"><button onclick="apply()">تسجيل وتفعيل الحساب</button><div id="msg" class="msg"></div><a href="/captain?mode=login">لدي حساب؟ تسجيل الدخول</a></section><script>const token=new URLSearchParams(location.search).get('invite');const $=id=>document.getElementById(id);async function apply(){if(!token)return fail('رابط الدعوة غير موجود');try{const r=await fetch('/api/captain/invites/'+encodeURIComponent(token)+'/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,phone:$('phone').value,authMethod:$('authMethod').value,pin:$('pin').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر التسجيل');$('msg').className='msg';$('msg').textContent='تم التسجيل والتفعيل. سيتم تحويلك إلى بوابة الكابتن.';setTimeout(()=>location.href='/captain?mode=login',900)}catch(e){fail(e.message)}}function fail(t){$('msg').className='msg error';$('msg').textContent=t}</script></body></html>

services:
  - type: web
    name: meta-bot-aljarah
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: BOT_NUMBER
        value: "0797217805"
      - key: PHONE
        value: "0797217805"
      - key: BOT_PHONE
        value: "0797217805"
      - key: BOT_PHONE_INTL
        value: "962797217805"
      - key: WHATSAPP_GROUP_ID
        value: "120363429069112648@g.us"
      - key: WHATSAPP_GROUP_NAME
        value: "شركة الجراح — شبكة التشغيل الرسمية"
      - key: PUBLIC_BASE_URL
        value: https://bot.wasselni-biz.com
      - key: SESSION_PATH
        value: /app/data/auth
      - key: DB_PATH
        value: /app/data/db_0797217805.db
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: QR_PUBLIC
        value: "false"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: DATA_DIR
        value: /app/data
      - key: AUTH_PATH
        value: /app/data/auth
      - key: BAILEYS_AUTH_PATH
        value: /app/data/.baileys_auth
      - key: BAILEYS_ENABLED
        value: "false"
      - key: SUBSCRIPTION_REQUIRED
        value: "true"
      - key: API_RATE_LIMIT_MAX
        value: "120"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: WHATSAPP_INIT_TIMEOUT_MS
        value: "180000"
      - key: WHATSAPP_RECONNECT_BASE_DELAY_MS
        value: "5000"
      - key: WHATSAPP_RECONNECT_MAX_DELAY_MS
        value: "120000"
      - key: WHATSAPP_RECONNECT_MAX_ATTEMPTS
        value: "20"

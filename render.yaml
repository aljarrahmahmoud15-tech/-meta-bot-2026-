services:
  - type: web
    name: "-meta-bot-2026-"
    runtime: node
    runtimeVersion: "22.13.0"
    plan: standard
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: BOT_NUMBER
        value: "0775969880"
      - key: PHONE
        value: "0775969880"
      - key: SESSION_PATH
        value: /data/auth
      - key: DB_PATH
        value: /data/db_0775969880.db
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: QR_PUBLIC
        value: "false"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
      - key: DATA_DIR
        value: /data
      - key: AUTH_PATH
        value: /data/auth
      - key: BAILEYS_AUTH_PATH
        value: /data/.baileys_auth
      - key: BAILEYS_ENABLED
        value: "false"
      - key: API_RATE_LIMIT_MAX
        value: "120"
      - key: RATE_LIMIT_WINDOW_MS
        value: "900000"
      - key: WHATSAPP_INIT_TIMEOUT_MS
        value: "180000"
      - key: WHATSAPP_RECONNECT_BASE_DELAY_MS
        value: "5000"
      - key: WHATSAPP_RECONNECT_MAX_DELAY_MS
        value: "120000"
      - key: WHATSAPP_RECONNECT_MAX_ATTEMPTS
        value: "20"
